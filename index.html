<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFA - Schedule Dashboard</title>
    <meta name="description" content="Read-only TV digital dashboard for SAFA schedule." />
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#090e1a">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.svg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            background-color: #090e1a; /* Ultra-deep high-contrast slate */
            color: #f8fafc;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding: clamp(8px, 1.5vh, 18px) clamp(10px, 1.8vw, 24px);
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            min-height: 44px;
            height: clamp(44px, 6.5vh, 68px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
            padding-bottom: clamp(4px, 0.6vh, 8px);
            margin-bottom: clamp(4px, 0.6vh, 8px);
            gap: clamp(8px, 1vw, 20px);
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: clamp(6px, 0.8vw, 14px);
            min-width: 0;
            flex-shrink: 1;
        }

        .brand-logo {
            font-size: clamp(20px, 3.6vh, 36px);
            font-weight: 900;
            letter-spacing: 0.12em;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .brand-title {
            font-size: clamp(12px, 2vh, 20px);
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #94a3b8;
            text-transform: uppercase;
            border-left: 2px solid #334155;
            padding-left: clamp(6px, 0.8vw, 12px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: clamp(6px, 0.7vw, 14px);
            flex-shrink: 0;
            max-width: 100%;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: clamp(3px, 0.4vh, 6px) clamp(8px, 0.8vw, 14px);
            border-radius: 9999px;
            font-size: clamp(11px, 1.5vh, 15px);
            font-weight: 600;
            color: #cbd5e1;
            white-space: nowrap;
            flex-shrink: 1;
        }

        .live-dot {
            height: 10px;
            width: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse-green 2s infinite;
            flex-shrink: 0;
        }

        .live-dot.offline {
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            animation: none;
        }

        .live-dot.filtered {
            background-color: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
            animation: none;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Filter Active Pill */
        .filter-active-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(245, 158, 11, 0.16);
            border: 1px solid #f59e0b;
            color: #fde68a;
            padding: clamp(3px, 0.35vh, 6px) clamp(6px, 0.7vw, 12px);
            border-radius: 9999px;
            font-size: clamp(11px, 1.4vh, 14px);
            font-weight: 700;
            letter-spacing: 0.03em;
            animation: fadeIn 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .filter-pill-dot {
            height: 8px;
            width: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #f59e0b;
            flex-shrink: 0;
        }

        .quick-reset-btn {
            background: rgba(245, 158, 11, 0.25);
            border: 1px solid rgba(245, 158, 11, 0.5);
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .quick-reset-btn:hover {
            background: #f59e0b;
            color: #090e1a;
        }

        /* Live Sync Button */
        .sync-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: clamp(4px, 0.45vh, 8px) clamp(8px, 0.8vw, 14px);
            min-height: 32px;
            border-radius: 9999px;
            font-size: clamp(11px, 1.5vh, 15px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .sync-btn:hover {
            background: #1e293b;
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .sync-btn.syncing {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .sync-btn.syncing svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .last-sync-time {
            color: #64748b;
            font-size: clamp(10px, 1.3vh, 13px);
            font-weight: 600;
            padding-left: 6px;
            border-left: 1px solid #334155;
            margin-left: 2px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Filter Trigger Button - Distinct, Prominent, Highly Visible */
        .filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 1.5px solid #38bdf8;
            color: #ffffff;
            padding: clamp(4px, 0.45vh, 8px) clamp(10px, 0.9vw, 16px);
            min-height: 32px;
            border-radius: 9999px;
            font-size: clamp(12px, 1.6vh, 16px);
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
            z-index: 15;
        }

        .filter-btn:hover {
            background: #0ea5e9;
            color: #ffffff;
            box-shadow: 0 0 22px rgba(56, 189, 248, 0.6);
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #b45309 0%, #78350f 100%);
            border-color: #fbbf24;
            color: #fef08a;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.5);
        }

        .clock-display {
            font-size: clamp(14px, 2.6vh, 26px);
            font-weight: 700;
            color: #f1f5f9;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
            padding-left: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Floating Filter Button for small viewports & inspect view */
        .floating-filter-fab {
            display: none;
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 90;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 2px solid #38bdf8;
            color: #ffffff;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .floating-filter-fab:hover {
            transform: scale(1.08);
            background: #0ea5e9;
            box-shadow: 0 6px 26px rgba(56, 189, 248, 0.7);
        }

        .floating-filter-fab.active {
            background: linear-gradient(135deg, #b45309 0%, #78350f 100%);
            border-color: #fbbf24;
            color: #fef08a;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.6);
        }

        /* Responsive Breakpoints for Inspecting & DevTools Docking */
        @media (max-width: 1200px) {
            .brand-title {
                display: none; /* Hide subtitle so controls never get pushed off */
            }
            .status-badge .last-sync-time {
                display: none; /* Hide timestamp */
            }
        }

        @media (max-width: 900px) {
            .top-bar {
                gap: 8px;
            }
            .filter-btn {
                padding: 5px 10px;
                font-size: 13px;
            }
            .sync-btn {
                padding: 5px 8px;
                font-size: 13px;
            }
            .clock-display {
                font-size: 15px;
            }
        }

        @media (max-width: 720px) {
            #connection-status {
                display: none; /* Keep just the live dot */
            }
            #sync-btn-label {
                display: none; /* Keep just the sync icon */
            }
            .filter-active-pill span#filter-pill-text {
                max-width: 90px;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }

        @media (max-width: 580px) {
            .clock-display {
                display: none; /* Hide clock on narrow mobile so Filter & Sync stay 100% visible */
            }
            .floating-filter-fab {
                display: flex; /* Show floating FAB in addition to top-bar button */
            }
        }

        @media (max-height: 550px) {
            .top-bar {
                min-height: 38px;
                height: 38px;
                margin-bottom: 4px;
            }
            .brand-logo {
                font-size: 18px;
            }
            .filter-btn, .sync-btn, .status-badge {
                min-height: 28px;
                padding: 2px 8px;
                font-size: 12px;
            }
            .clock-display {
                font-size: 14px;
            }
        }

        /* Table Structure */
        .table-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            overflow: hidden;
            background-color: #0f172a;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        /* Headers */
        thead {
            background-color: #1e293b;
        }

        .top-header-row {
            height: 4.2vh;
            border-bottom: 1px solid #334155;
        }

        .top-header-row th {
            text-align: center;
            font-size: 2.2vh;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* Dynamic Day Group Header Gradients */
        .day-group-yesterday {
            background: linear-gradient(180deg, #1e293b 0%, #451a03 100%);
            color: #fbbf24;
            border-left: 2px solid #d97706;
            border-right: 2px solid #334155;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.35);
        }

        .day-group-today {
            background: linear-gradient(180deg, #1e293b 0%, #172554 100%);
            color: #60a5fa;
            border-left: 2px solid #3b82f6;
            border-right: 2px solid #334155;
            text-shadow: 0 0 12px rgba(96, 165, 250, 0.35);
        }

        .day-group-tomorrow {
            background: linear-gradient(180deg, #1e293b 0%, #1e1b4b 100%);
            color: #c084fc;
            border-left: 2px solid #a855f7;
            border-right: 2px solid #334155;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.35);
        }

        .day-group-other {
            background: linear-gradient(180deg, #1e293b 0%, #042f2e 100%);
            color: #2dd4bf;
            border-left: 2px solid #14b8a6;
            border-right: 1px solid #334155;
            text-shadow: 0 0 12px rgba(45, 212, 191, 0.35);
        }

        .sub-header-row {
            height: 3.6vh;
            background-color: #111c30;
            border-bottom: 2px solid #334155;
        }

        .sub-header-row th {
            font-size: 1.8vh;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #94a3b8;
            text-transform: uppercase;
            padding: 0 0.8vw;
            text-align: left;
        }

        .sub-header-row th.text-center {
            text-align: center;
        }

        /* Data Rows: exactly 15 rows distributed evenly */
        tbody tr {
            height: calc((100% - 7.8vh) / 15);
            border-bottom: 1px solid #1e293b;
            transition: background-color 0.15s ease;
        }

        tbody tr:nth-child(even) {
            background-color: #0b1322;
        }

        tbody tr:nth-child(odd) {
            background-color: #101a2d;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 0 0.8vw;
            font-size: 2.1vh;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        /* Column Group Dividers */
        .day-divider-left {
            border-left: 2px solid #334155;
        }

        .cell-name {
            color: #f8fafc;
            font-weight: 700;
            font-size: 2.2vh;
            letter-spacing: 0.02em;
        }

        .cell-route {
            color: #e2e8f0;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Type Badges */
        .badge {
            display: inline-block;
            text-align: center;
            width: 100%;
            max-width: 9vw;
            padding: 0.25vh 0;
            border-radius: 0.375rem;
            font-size: 1.8vh;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .badge-order {
            background-color: rgba(14, 165, 233, 0.18);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .badge-supply {
            background-color: rgba(34, 197, 94, 0.18);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.4);
        }

        .badge-empty {
            color: #475569;
        }

        .empty-row-text {
            color: #334155;
        }

        /* Modal Styles */
        .filter-modal-backdrop {
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .filter-modal-backdrop.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .filter-modal-box {
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Top Bar Header -->
        <div class="top-bar">
            <div class="brand-section">
                <div class="brand-logo">SAFA</div>
                <div class="brand-title">Schedule Dashboard</div>
            </div>
            
            <div class="top-bar-right">
                <!-- Active Filter Indicator Pill (Visible when filtered) -->
                <div id="filter-active-pill" class="filter-active-pill hidden">
                    <span class="filter-pill-dot"></span>
                    <span id="filter-pill-text">FILTERED</span>
                    <button id="quick-reset-btn" class="quick-reset-btn" title="Reset to Live Rolling Window (R)">✕ Reset</button>
                </div>

                <!-- Supabase Realtime Status Badge -->
                <div class="status-badge" id="status-badge-container" title="Supabase Realtime Sync Status">
                    <span class="live-dot" id="connection-dot"></span>
                    <span id="connection-status">Connecting...</span>
                    <span id="last-sync-time" class="last-sync-time">--:--:--</span>
                </div>

                <!-- Manual Live Sync Button -->
                <button id="manual-sync-btn" class="sync-btn" title="Sync live schedule data now (S)">
                    <svg id="sync-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span id="sync-btn-label">Sync</span>
                </button>

                <!-- Date Range Filter Trigger Button (Prominent & High Priority) -->
                <button id="open-filter-btn" class="filter-btn" title="Filter Schedule Dates (F)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                    </svg>
                    <span id="filter-btn-text">Filter Date</span>
                </button>

                <!-- Live Clock Display -->
                <div class="clock-display" id="live-clock">00:00:00</div>
            </div>
        </div>

        <!-- 15-Row Dynamic Schedule Table -->
        <div class="table-wrapper">
            <table id="schedule-table">
                <colgroup id="schedule-colgroup">
                    <!-- Injected dynamically based on active dates -->
                </colgroup>
                <thead>
                    <!-- Top Header Row: Grouped by Date / Day -->
                    <tr class="top-header-row" id="top-header-row">
                        <!-- Injected dynamically -->
                    </tr>
                    <!-- Sub-Header Row: Route & Type -->
                    <tr class="sub-header-row" id="sub-header-row">
                        <!-- Injected dynamically -->
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- Exactly 15 rows injected dynamically -->
                </tbody>
            </table>
        </div>

        <!-- Floating Filter FAB (Accessible when inspecting or on compact viewports) -->
        <button id="floating-filter-btn" class="floating-filter-fab" title="Filter Schedule Dates (F)" aria-label="Open schedule filter">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
            </svg>
        </button>
    </div>

    <!-- Date Range & Preset Filter Modal -->
    <div id="filter-modal" class="filter-modal-backdrop hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-3 sm:p-4 overflow-y-auto">
        <div class="filter-modal-box bg-[#0f172a] border border-[#334155] rounded-2xl p-4 sm:p-6 w-[95vw] max-w-lg shadow-2xl text-slate-100 flex flex-col gap-3 sm:gap-4 my-auto max-h-[92vh] overflow-y-auto">
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-[#334155] pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-sky-400 font-extrabold text-xl">📅 Schedule Date Filter</span>
                    <span id="modal-view-mode-badge" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full border border-slate-700">Custom Range</span>
                </div>
                <button id="close-filter-modal-btn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition" title="Close (Esc)">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Sync & Filter Persistence Notice -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-2 text-[11px] text-slate-300 flex items-center justify-between">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>Realtime sync stays active on filtered dates</span>
                </div>
                <span id="modal-sync-timestamp" class="text-slate-400 font-mono">Sync: --:--:--</span>
            </div>

            <!-- Quick Presets Section -->
            <div class="flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs uppercase tracking-wider text-slate-400 font-bold">Quick Presets</span>
                    <span class="text-[11px] text-sky-400 font-semibold">1-Click Fast Switch</span>
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <!-- Yesterday Preset Button -->
                    <button id="preset-yesterday-btn" class="preset-btn bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/50 hover:border-amber-400 text-amber-300 font-bold py-2 px-1 rounded-xl text-center transition flex flex-col items-center justify-center gap-0.5 shadow-sm shadow-amber-500/10 cursor-pointer">
                        <span class="text-xs flex items-center gap-1">🕒 Yesterday</span>
                        <span class="text-[9px] text-amber-200/80 font-medium">1-Day Past</span>
                    </button>

                    <!-- Today Only Preset Button -->
                    <button id="preset-today-btn" class="preset-btn bg-blue-500/15 hover:bg-blue-500/25 border border-blue-500/50 hover:border-blue-400 text-blue-300 font-bold py-2 px-1 rounded-xl text-center transition flex flex-col items-center justify-center gap-0.5 shadow-sm shadow-blue-500/10 cursor-pointer">
                        <span class="text-xs flex items-center gap-1">📅 Today</span>
                        <span class="text-[9px] text-blue-200/80 font-medium">1-Day Focus</span>
                    </button>

                    <!-- Yesterday to Tomorrow Preset Button -->

                        <span class="text-xs flex items-center gap-1">🟢 Live 3-Day</span>

            <!-- Custom From - To Range Section -->

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">From Date (Start)</label>
                        <input type="date" id="filter-from-date" class="w-full bg-[#0b1322] border border-[#334155] rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">

                        <input type="date" id="filter-to-date" class="w-full bg-[#0b1322] border border-[#334155] rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">

                        Apply Filter View
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // Persistent Filter State Management
        // -------------------------------------------------------------
        const FILTER_STORAGE_KEY = 'safa_tv_schedule_filter_v2';

        let filterState = {
            isFiltered: false,
            preset: null, // 'yesterday' | 'today_only' | 'yesterday_tomorrow' | 'august_demo' | 'custom'
            startDateStr: null,
            endDateStr: null
        };

        let currentTodayStr = new Date().toDateString();
        let lastSyncTimestamp = null;
        let isCurrentlyFetching = false;

        function saveFilterState() {
            try {
                localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(filterState));
            } catch (e) {
                console.warn('LocalStorage save error:', e);
            }
        }

        function loadFilterState() {
            // 1. Check URL parameters first (e.g. ?preset=yesterday or ?from=2026-08-29&to=2026-08-31)
            const urlParams = new URLSearchParams(window.location.search);
            const paramPreset = urlParams.get('preset');
            const paramFrom = urlParams.get('from');
            const paramTo = urlParams.get('to');

            if (paramPreset === 'yesterday') {
                filterState = { isFiltered: true, preset: 'yesterday', startDateStr: null, endDateStr: null };
                return;
            } else if (paramPreset === 'today') {
                filterState = { isFiltered: true, preset: 'today_only', startDateStr: null, endDateStr: null };
                return;
            } else if (paramPreset === 'archive') {
                filterState = { isFiltered: true, preset: 'yesterday_tomorrow', startDateStr: null, endDateStr: null };
                return;
            } else if (paramPreset === 'live') {
                filterState = { isFiltered: false, preset: null, startDateStr: null, endDateStr: null };
                return;
            } else if (paramFrom && paramTo) {
                filterState = { isFiltered: true, preset: 'custom', startDateStr: paramFrom, endDateStr: paramTo };
                return;
            }

            // 2. Load from localStorage if available
            try {
                const saved = localStorage.getItem(FILTER_STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed.isFiltered === 'boolean') {
                        filterState = parsed;
                    }
                }
            } catch (e) {
                console.warn('LocalStorage load error:', e);
            }
        }

        // Initialize saved filter state before anything else
        loadFilterState();

        // -------------------------------------------------------------
        // Live Clock & Midnight Rollover Logic
        // -------------------------------------------------------------
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour12: true, 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('live-clock').textContent = timeString;
            
            // Check for midnight rollover
            if (now.toDateString() !== currentTodayStr) {
                currentTodayStr = now.toDateString();
                console.log("Midnight Rollover Detected: Updating schedule views.");
                // Fetch schedule and dynamically advance date windows
                fetchSupabaseSchedule(true);
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // -------------------------------------------------------------
        // Date Utilities
        // -------------------------------------------------------------
        function getRollingDates() {
            const today = new Date();
            const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
            const dayAfter = new Date(today); dayAfter.setDate(today.getDate() + 2);
            return [today, tomorrow, dayAfter];
        }

        function getYesterdayDate() {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            return yesterday;
        }

        function formatDateForDB(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function formatDateForHeader(d) {
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dateStr = `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()} ${days[d.getDay()]}`;
            
            const today = new Date();
            const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
            const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);

            if (isSameDay(d, yesterday)) {
                return `${dateStr} • YEST`;
            } else if (isSameDay(d, today)) {
                return `${dateStr} • TODAY`;
            } else if (isSameDay(d, tomorrow)) {
                return `${dateStr} • TOM`;
            }
            return dateStr;
        }

        function getDayGroupClass(d, idx) {
            const today = new Date();
            const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
            const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);

            if (isSameDay(d, yesterday)) {
                return 'day-group-yesterday';
            } else if (isSameDay(d, today)) {
                return 'day-group-today';
            } else if (isSameDay(d, tomorrow)) {
                return 'day-group-tomorrow';
            }
            return 'day-group-other';
        }

        function getTypeBadge(typeStr) {
            if (!typeStr) return '<span class="badge-empty">-</span>';
            const clean = typeStr.trim().toUpperCase();
            if (clean.includes('ORDER')) {
                return `<span class="badge badge-order">ORDER</span>`;
            } else if (clean.includes('SUPP')) {
                return `<span class="badge badge-supply">SUPPLY</span>`;
            }
            return `<span class="badge badge-order">${clean}</span>`;
        }

        // Resolves the concrete dates based on current filter state
        function resolveFilterDates() {
            if (!filterState.isFiltered) {
                return getRollingDates();
            }

            if (filterState.preset === 'yesterday') {
                return [getYesterdayDate()];
            } else if (filterState.preset === 'today_only') {
                return [new Date()];
            } else if (filterState.preset === 'yesterday_tomorrow') {
                const yest = getYesterdayDate();
                const today = new Date();
                const tom = new Date(); tom.setDate(today.getDate() + 1);
                return [yest, today, tom];
            } else if (filterState.preset === 'august_demo') {
                const d1 = new Date('2026-08-29T00:00:00');
                const d2 = new Date('2026-08-30T00:00:00');
                const d3 = new Date('2026-08-31T00:00:00');
                return [d1, d2, d3];
            } else if (filterState.startDateStr && filterState.endDateStr) {
                const start = new Date(filterState.startDateStr + 'T00:00:00');
                const end = new Date(filterState.endDateStr + 'T00:00:00');
                const dates = [];
                let curr = new Date(start);
                let count = 0;
                while (curr <= end && count < 5) {
                    dates.push(new Date(curr));
                    curr.setDate(curr.getDate() + 1);
                    count++;
                }
                return dates.length > 0 ? dates : getRollingDates();
            }

            return getRollingDates();
        }

        // -------------------------------------------------------------
        // Dynamic Table Geometry & Rendering
        // -------------------------------------------------------------
        const scheduleColgroup = document.getElementById('schedule-colgroup');
        const topHeaderRow = document.getElementById('top-header-row');
        const subHeaderRow = document.getElementById('sub-header-row');
        const tableBody = document.getElementById('schedule-body');

        function updateTableStructure(activeDates) {
            const numDays = activeDates.length;

            // 1. Generate Colgroup based on number of days
            let colgroupHTML = '';
            if (numDays === 1) {
                colgroupHTML = `
                    <col style="width: 28%;">
                    <col style="width: 44%;">
                    <col style="width: 28%;">
                `;
            } else if (numDays === 2) {
                colgroupHTML = `
                    <col style="width: 20%;">
                    <col style="width: 26%;">
                    <col style="width: 14%;">
                    <col style="width: 26%;">
                    <col style="width: 14%;">
                `;
            } else if (numDays === 3) {
                colgroupHTML = `
                    <col style="width: 16%;">
                    <col style="width: 15%;">
                    <col style="width: 13%;">
                    <col style="width: 15%;">
                    <col style="width: 13%;">
                    <col style="width: 15%;">
                    <col style="width: 13%;">
                `;
            } else {
                // 4 or more days
                const nameWidth = 16;
                const remaining = 84;
                const dayWidth = remaining / numDays;
                const routeWidth = dayWidth * 0.58;
                const typeWidth = dayWidth * 0.42;

                colgroupHTML = `<col style="width: ${nameWidth}%;">`;
                for (let i = 0; i < numDays; i++) {
                    colgroupHTML += `
                        <col style="width: ${routeWidth}%;">
                        <col style="width: ${typeWidth}%;">
                    `;
                }
            }
            scheduleColgroup.innerHTML = colgroupHTML;

            // 2. Generate Top Header Row
            let topHeaderHTML = '<th></th>';
            activeDates.forEach((d, idx) => {
                const groupClass = getDayGroupClass(d, idx);
                topHeaderHTML += `
                    <th colspan="2" class="${groupClass} day-divider-left">
                        ${formatDateForHeader(d)}
                    </th>
                `;
            });
            topHeaderRow.innerHTML = topHeaderHTML;

            // 3. Generate Sub-Header Row
            let subHeaderHTML = '<th>NAME</th>';
            for (let i = 0; i < numDays; i++) {
                subHeaderHTML += `
                    <th class="day-divider-left">ROUTE</th>
                    <th class="text-center">TYPE</th>
                `;
            }
            subHeaderRow.innerHTML = subHeaderHTML;
        }

        function renderRows(rawData = [], dateStrs = []) {
            const grouped = {};
            rawData.forEach(row => {
                const name = row.person_name;
                if (!grouped[name]) grouped[name] = {};
                grouped[name][row.route_date] = { route: row.route, type: row.type };
            });

            const uniqueNames = Object.keys(grouped).sort();
            tableBody.innerHTML = '';

            // Render EXACTLY 15 rows for TV layout
            for (let i = 0; i < 15; i++) {
                const tr = document.createElement('tr');
                const name = uniqueNames[i];

                if (name) {
                    let rowHTML = `<td class="cell-name">${name}</td>`;
                    dateStrs.forEach(dateStr => {
                        const dayData = grouped[name][dateStr] || {};
                        rowHTML += `
                            <td class="cell-route day-divider-left">${dayData.route || '-'}</td>
                            <td class="text-center">${getTypeBadge(dayData.type)}</td>
                        `;
                    });
                    tr.innerHTML = rowHTML;
                } else {
                    let emptyHTML = `<td class="empty-row-text">-</td>`;
                    dateStrs.forEach(() => {
                        emptyHTML += `
                            <td class="empty-row-text day-divider-left">-</td>
                            <td class="empty-row-text text-center">-</td>
                        `;
                    });
                    tr.innerHTML = emptyHTML;
                }
                tableBody.appendChild(tr);
            }
        }

        // -------------------------------------------------------------
        // Supabase Live Client Configuration
        // -------------------------------------------------------------
        const SUPABASE_URL = 'https://yhtgycnynpinnopbsyhk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlodGd5Y255bnBpbm5vcGJzeWhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDQ3OTgsImV4cCI6MjEwMzU4MDc5OH0.JPZQ849JWqTiw07VvZEvMXJJHHPLQimSvLalEhS9nro';

        let supabaseClient = null;

        if (SUPABASE_URL && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (err) {
                console.error("Supabase init error:", err);
            }
        }

        // -------------------------------------------------------------
        // Filter UI Synchronization Helper
        // -------------------------------------------------------------
        function updateFilterUIElements(activeDates, dateStrs) {
            const filterPill = document.getElementById('filter-active-pill');
            const filterPillText = document.getElementById('filter-pill-text');
            const openFilterBtn = document.getElementById('open-filter-btn');
            const floatingFilterBtn = document.getElementById('floating-filter-btn');
            const modalViewModeBadge = document.getElementById('modal-view-mode-badge');
            const connDot = document.getElementById('connection-dot');

            if (filterState.isFiltered) {
                if (filterPill) filterPill.classList.remove('hidden');
                if (openFilterBtn) openFilterBtn.classList.add('active');
                if (floatingFilterBtn) floatingFilterBtn.classList.add('active');
                if (connDot) connDot.classList.add('filtered');

                let label = '';
                if (filterState.preset === 'yesterday') {
                    label = 'YESTERDAY (1-Day)';
                } else if (filterState.preset === 'today_only') {
                    label = 'TODAY ONLY';
                } else if (filterState.preset === 'yesterday_tomorrow') {
                    label = 'YEST → TOM (3-Day)';
                } else if (filterState.preset === 'august_demo') {
                    label = 'DEMO SEED (29–31 AUG)';
                } else if (dateStrs.length === 1) {
                    label = dateStrs[0];
                } else {
                    label = `${dateStrs[0]} → ${dateStrs[dateStrs.length - 1]}`;
                }
                if (filterPillText) filterPillText.textContent = `FILTERED: ${label}`;

                if (modalViewModeBadge) {
                    modalViewModeBadge.textContent = `Filtered: ${label}`;
                    modalViewModeBadge.className = 'text-xs bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-full border border-amber-500/40 font-semibold';
                }
            } else {
                if (filterPill) filterPill.classList.add('hidden');
                if (openFilterBtn) openFilterBtn.classList.remove('active');
                if (floatingFilterBtn) floatingFilterBtn.classList.remove('active');
                if (connDot) connDot.classList.remove('filtered');

                if (modalViewModeBadge) {
                    modalViewModeBadge.textContent = 'Live Rolling 3-Day';
                    modalViewModeBadge.className = 'text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-500/40 font-semibold';
                }
            }

            highlightActivePresetButton();
        }

        function highlightActivePresetButton() {
            const presets = [
                { id: 'preset-yesterday-btn', active: filterState.isFiltered && filterState.preset === 'yesterday' },
                { id: 'preset-today-btn', active: filterState.isFiltered && filterState.preset === 'today_only' },
                { id: 'preset-yesterday-tomorrow-btn', active: filterState.isFiltered && filterState.preset === 'yesterday_tomorrow' },
                { id: 'preset-live-3day-btn', active: !filterState.isFiltered }
            ];

            presets.forEach(p => {
                const el = document.getElementById(p.id);
                if (!el) return;
                if (p.active) {
                    el.classList.add('ring-2', 'ring-sky-400', 'shadow-lg');
                } else {
                    el.classList.remove('ring-2', 'ring-sky-400', 'shadow-lg');
                }
            });
        }

        // -------------------------------------------------------------
        // Supabase Fetch & Realtime Sync Handler
        // -------------------------------------------------------------
        async function fetchSupabaseSchedule(isManualOrRealtime = false) {
            if (isCurrentlyFetching && !isManualOrRealtime) return;
            isCurrentlyFetching = true;

            const syncBtn = document.getElementById('manual-sync-btn');
            const syncLabel = document.getElementById('sync-btn-label');
            if (syncBtn) {
                syncBtn.classList.add('syncing');
                if (syncLabel) syncLabel.textContent = 'Syncing...';
            }

            // Always resolve dates using the persistent filter state
            const activeDates = resolveFilterDates();
            const dateStrs = activeDates.map(d => formatDateForDB(d));

            // Update Dynamic Table Geometry
            updateTableStructure(activeDates);

            // Update Filter Indicators and Badges
            updateFilterUIElements(activeDates, dateStrs);

            const connDot = document.getElementById('connection-dot');
            const statusText = document.getElementById('connection-status');
            const lastSyncEl = document.getElementById('last-sync-time');
            const modalSyncTimestamp = document.getElementById('modal-sync-timestamp');

            if (!supabaseClient) {
                renderRows([], dateStrs);
                if (statusText) statusText.textContent = 'Demo Mode (No Keys)';
                if (connDot) connDot.classList.add('offline');
                completeSync();
                return;
            }

            try {
                const fromDateStr = dateStrs[0];
                const toDateStr = dateStrs[dateStrs.length - 1];

                const { data, error } = await supabaseClient
                    .from('safa_daily_routes')
                    .select('*')
                    .gte('route_date', fromDateStr)
                    .lte('route_date', toDateStr);

                if (error) throw error;

                renderRows(data || [], dateStrs);

                const now = new Date();
                lastSyncTimestamp = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if (lastSyncEl) lastSyncEl.textContent = `Sync ${lastSyncTimestamp}`;
                if (modalSyncTimestamp) modalSyncTimestamp.textContent = `Synced: ${lastSyncTimestamp}`;

                if (statusText) {
                    statusText.textContent = filterState.isFiltered ? 'Filtered (Synced)' : 'Live (Synced)';
                }
                if (connDot) connDot.classList.remove('offline');
            } catch (err) {
                console.error('Could not sync remote schedule table:', err);
                if (statusText) statusText.textContent = 'Sync Error (Retrying)';
                if (connDot) connDot.classList.add('offline');
            } finally {
                completeSync();
            }
        }

        function completeSync() {
            isCurrentlyFetching = false;
            const syncBtn = document.getElementById('manual-sync-btn');
            const syncLabel = document.getElementById('sync-btn-label');
            if (syncBtn) {
                setTimeout(() => {
                    syncBtn.classList.remove('syncing');
                    if (syncLabel) syncLabel.textContent = 'Sync';
                }, 350);
            }
        }

        // Initial Data Fetch
        fetchSupabaseSchedule();

        // Supabase Realtime Subscription
        if (supabaseClient) {
            supabaseClient
                .channel('safa-realtime-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'safa_daily_routes' }, (payload) => {
                    console.log('Realtime change received from database:', payload);
                    // Flash sync animation and refresh data without losing active filter
                    const syncBtn = document.getElementById('manual-sync-btn');
                    if (syncBtn) syncBtn.classList.add('syncing');
                    fetchSupabaseSchedule(true);
                })
                .subscribe((status) => {
                    const statusText = document.getElementById('connection-status');
                    const connDot = document.getElementById('connection-dot');
                    if (status === 'SUBSCRIBED') {
                        if (statusText) statusText.textContent = filterState.isFiltered ? 'Filtered (Live)' : 'Live (Realtime)';
                        if (connDot) connDot.classList.remove('offline');
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        if (statusText) statusText.textContent = 'Connecting...';
                        if (connDot) connDot.classList.add('offline');
                    }
                });
        }

        // -------------------------------------------------------------
        // Filter Modal & Presets Controls
        // -------------------------------------------------------------
        const filterModal = document.getElementById('filter-modal');
        const openFilterBtn = document.getElementById('open-filter-btn');
        const closeFilterModalBtn = document.getElementById('close-filter-modal-btn');
        const cancelFilterModalBtn = document.getElementById('cancel-filter-modal-btn');
        const applyFilterBtn = document.getElementById('apply-filter-btn');
        const resetFilterModalBtn = document.getElementById('reset-filter-modal-btn');
        const quickResetBtn = document.getElementById('quick-reset-btn');
        const manualSyncBtn = document.getElementById('manual-sync-btn');

        const fromDateInput = document.getElementById('filter-from-date');
        const toDateInput = document.getElementById('filter-to-date');

        const presetYesterdayBtn = document.getElementById('preset-yesterday-btn');
        const presetTodayBtn = document.getElementById('preset-today-btn');
        const presetYesterdayTomorrowBtn = document.getElementById('preset-yesterday-tomorrow-btn');
        const presetLive3DayBtn = document.getElementById('preset-live-3day-btn');
        const presetAugustDemoBtn = document.getElementById('preset-august-demo-btn');

        function openModal() {
            const activeDates = resolveFilterDates();
            // Populate dates into inputs only when opening to not overwrite user edits
            fromDateInput.value = formatDateForDB(activeDates[0]);
            toDateInput.value = formatDateForDB(activeDates[activeDates.length - 1]);
            highlightActivePresetButton();
            if (lastSyncTimestamp) {
                const modalSyncTimestamp = document.getElementById('modal-sync-timestamp');
                if (modalSyncTimestamp) modalSyncTimestamp.textContent = `Synced: ${lastSyncTimestamp}`;
            }
            filterModal.classList.remove('hidden');
        }

        function closeModal() {
            filterModal.classList.add('hidden');
        }

        function resetToLive() {
            filterState = {
                isFiltered: false,
                preset: null,
                startDateStr: null,
                endDateStr: null
            };
            saveFilterState();
            closeModal();
            fetchSupabaseSchedule(true);
        }

        function applyPreset(presetName) {
            if (presetName === 'live_3day') {
                resetToLive();
                return;
            }

            filterState = {
                isFiltered: true,
                preset: presetName,
                startDateStr: null,
                endDateStr: null
            };

            if (presetName === 'august_demo') {
                filterState.startDateStr = '2026-08-29';
                filterState.endDateStr = '2026-08-31';
            }

            saveFilterState();
            closeModal();
            fetchSupabaseSchedule(true);
        }

        function applyCustomDateRange(startDate, endDate) {
            const startStr = formatDateForDB(startDate);
            const endStr = formatDateForDB(endDate);

            filterState = {
                isFiltered: true,
                preset: 'custom',
                startDateStr: startStr,
                endDateStr: endStr
            };

            saveFilterState();
            closeModal();
            fetchSupabaseSchedule(true);
        }

        // Event Listeners for Filter Modal & Actions
        if (openFilterBtn) openFilterBtn.addEventListener('click', openModal);
        const floatingFilterBtn = document.getElementById('floating-filter-btn');
        if (floatingFilterBtn) floatingFilterBtn.addEventListener('click', openModal);

        closeFilterModalBtn.addEventListener('click', closeModal);
        cancelFilterModalBtn.addEventListener('click', closeModal);
        resetFilterModalBtn.addEventListener('click', resetToLive);
        quickResetBtn.addEventListener('click', resetToLive);

        // Manual Live Sync Button Click
        manualSyncBtn.addEventListener('click', () => {
            fetchSupabaseSchedule(true);
        });

        // Close on background click
        filterModal.addEventListener('click', (e) => {
            if (e.target === filterModal) closeModal();
        });

        // Keyboard & Smart TV Remote Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) {
                if (e.key === 'Escape') closeModal();
                return;
            }

            const key = e.key.toLowerCase();
            if (key === 'escape' && !filterModal.classList.contains('hidden')) {
                closeModal();
            } else if (key === 'f') {
                if (filterModal.classList.contains('hidden')) {
                    openModal();
                } else {
                    closeModal();
                }
            } else if (key === 's') {
                fetchSupabaseSchedule(true);
            } else if (key === 'r') {
                resetToLive();
            }
        });

        // Preset 1: Yesterday (1-Day Past View)
        presetYesterdayBtn.addEventListener('click', () => {
            applyPreset('yesterday');
        });

        // Preset 2: Today (1-Day Current View)
        presetTodayBtn.addEventListener('click', () => {
            applyPreset('today_only');
        });

        // Preset 3: Yesterday to Tomorrow (3-Day Archive View)
        presetYesterdayTomorrowBtn.addEventListener('click', () => {
            applyPreset('yesterday_tomorrow');
        });

        // Preset 4: Live 3-Day Default
        presetLive3DayBtn.addEventListener('click', resetToLive);

        // Preset 5: August Seed Demo Data
        presetAugustDemoBtn.addEventListener('click', () => {
            applyPreset('august_demo');
        });

        // Apply Custom From - To Filter
        applyFilterBtn.addEventListener('click', () => {
            if (!fromDateInput.value || !toDateInput.value) {
                alert('Please select both From and To dates.');
                return;
            }

            let start = new Date(fromDateInput.value + 'T00:00:00');
            let end = new Date(toDateInput.value + 'T00:00:00');

            if (start > end) {
                const temp = start;
                start = end;
                end = temp;
            }

            applyCustomDateRange(start, end);
        });

        // -------------------------------------------------------------
        // PWA Service Worker Registration (GitHub Pages compatible)
        // -------------------------------------------------------------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        // Trigger immediate check to refresh cached shell if new version exists
                        registration.update();
                    })
                    .catch((error) => {
                        console.warn('PWA ServiceWorker registration notice:', error);
                    });
            });
        }
    </script>
</body>
</html>
